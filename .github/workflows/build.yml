name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest          # виндовая виртуалка

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Run tests
        run: dotnet test CurrencyConverter.Tests/CurrencyConverter.Tests.csproj -c Release

      - name: Publish Windows exe
        run: dotnet publish CurrencyConverter/CurrencyConverter.csproj -c Release -f net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter-win
          path: CurrencyConverter/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/
